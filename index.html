<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>منصة إتقان</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f5;color:#18352b}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:1100px;margin:auto;padding:18px}
    .card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #00000012}
    h1,h2,h3{margin-top:0}
    .muted{color:#66756f}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    label{display:block;font-weight:bold;margin:10px 0 6px}
    input,select,textarea{width:100%;padding:11px;border:1px solid #ccd8d2;border-radius:10px;background:#fff}
    .btn{border:0;border-radius:10px;padding:11px 16px;background:#1f7a55;color:#fff}
    .btn.alt{background:#e8f1ed;color:#1f5d46}
    .btn.danger{background:#b33a3a}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav button{border:0;background:#e8f1ed;color:#174c39;border-radius:10px;padding:10px 14px}
    header{background:#164d3a;color:white;padding:18px;border-radius:20px;margin-bottom:14px}
    .badge{display:inline-block;background:#e8f1ed;color:#18583f;padding:5px 9px;border-radius:20px;font-size:13px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:9px;border-bottom:1px solid #e5ebe8;text-align:right}
    .login{max-width:460px;margin:8vh auto}
    .hidden{display:none}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .notice{padding:12px;border-radius:12px;background:#fff8df;color:#725b10;margin:10px 0}
    .stat{font-size:28px;font-weight:bold}
    @media(max-width:600px){.wrap{padding:10px}.card{padding:14px}header{border-radius:14px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function(){
  const KEY = "itqan_sunnah_v2";
  const SESSION = "itqan_session_v2";
  const DAYS = ["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
  const LEVELS = [
    {id:"1", name:"المستوى الأول", matn:["الأصول الثلاثة وأدلتها","تحفة الأطفال والغلمان","الأرجوزة الميئية","الأربعون في مباني الإسلام"]},
    {id:"2", name:"المستوى الثاني", matn:["نظم الآجرومية","المنظومة البيقونية","منظومة أبي إسحاق الإلبيري","مختصر الآداب والأذكار"]},
    {id:"3", name:"المستوى الثالث", matn:["العقيدة الواسطية","كتاب التوحيد","المقدمة الآجرومية","تسهيل الطرقات في نظم الورقات"]},
    {id:"4", name:"المستوى الرابع", matn:["عمدة الأحكام"]},
    {id:"5", name:"الإضافي", matn:["الشاطبية في القراءات"]}
  ];
  const TEACHERS = Array.from({length:14},(_,i)=>({id:"t"+(i+1), name:"أستاذة الحلقة "+(i+1), circle:i+1, code:"t"+(i+1)}));

  function blank(){
    return {
      circles: Array.from({length:14},(_,i)=>({id:i+1, name:"الحلقة "+(i+1), day:"السبت", mode:"حضوري"})),
      students: [],
      recitations: []
    };
  }

  function load(){
    try{
      const x = JSON.parse(localStorage.getItem(KEY));
      return x && x.circles && x.students && x.recitations ? x : blank();
    }catch(e){
      return blank();
    }
  }

  let data = load();
  let session = JSON.parse(localStorage.getItem(SESSION)||"null");
  let page = "home";

  function save(){
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function esc(s){
    return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function teacher(){
    return TEACHERS.find(x => x.id === session?.teacherId);
  }

  function circle(){
    return data.circles.find(x => x.id === teacher()?.circle);
  }

  function level(id){
    return LEVELS.find(x => x.id === id);
  }

  function fmtDate(d){
    return d ? new Date(d).toLocaleDateString("ar-LY") : new Date().toLocaleDateString("ar-LY");
  }

  function loginView(){
    return `<div class="wrap login"><div class="card">
      <h1>منصة إتقان</h1><p class="muted">مركز سعد بن معاذ للسنة والمتون</p>
      <div class="notice">تسجيل الدخول للمعلمات</div>
      <form id="loginForm">
        <label>اختاري الحلقة</label><select id="teacherId" required><option value="">اختاري الحلقة</option>${TEACHERS.map(t=>`<option value="${t.id}">الحلقة ${t.circle}</option>`).join("")}</select>
        <label>رمز الدخول</label><input id="loginCode" required autocomplete="off" placeholder="أدخلي رمز الدخول">
        <button class="btn" style="width:100%;margin-top:14px">دخول</button>
      </form>
    </div></div>`;
  }

  function layout(content){
    const t = teacher(), c = circle();
    return `<div class="wrap"><header>
      <h1>منصة إتقان</h1><div>مركز سعد بن معاذ للسنة والمتون</div>
      <div class="actions">
        <span class="badge">${esc(t.name)}</span>
        <span class="badge">${esc(c?.name||"")}</span>
        <span class="badge">${esc(c?.day||"")} - ${esc(c?.mode||"")}</span>
      </div>
    </header>
    <div class="nav">
      ${["home","students","recitation","reports","settings"].map((p,i)=>`<button data-page="${p}">${["الرئيسية","الطالبات","التسميع","التقارير","الإعدادات"][i]}</button>`).join("")}
      <button id="logout">تسجيل الخروج</button>
    </div>${content}</div>`;
  }

  function home(){
    const mine = data.students.filter(s => s.circle === teacher().circle);
    const rec = data.recitations.filter(r => r.circle === teacher().circle);
    return `<div class="card">
      <h2>أهلًا بك يا ${esc(teacher().name)}</h2>
      <div class="grid">
        <div><div class="muted">عدد الطالبات</div><div class="stat">${mine.length}</div></div>
        <div><div class="muted">سجلات التسميع</div><div class="stat">${rec.length}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>معلومات الحلقة</h3>
      <p>اليوم: <b>${esc(circle().day)}</b></p>
      <p>نوع الحلقة: <b>${esc(circle().mode)}</b></p>
      <p class="muted">يمكن للمعلمة تغيير اليوم ونوع الحلقة من الإعدادات.</p>
    </div>`;
  }

  function students(){
    const mine = data.students.filter(s => s.circle === teacher().circle);
    return `<div class="card">
      <h2>إضافة طالبة</h2>
      <form id="studentForm"><div class="grid">
        <div><label>اسم الطالبة الثلاثي</label><input id="sName" required></div>
        <div><label>المستوى</label><select id="sLevel" required><option value="">اختاري المستوى</option>${LEVELS.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div>
        <div><label>المتن المقرر</label><select id="sMatn" required disabled><option value="">اختاري المستوى أولًا</option></select></div>
      </div><button class="btn">حفظ الطالبة وتوليد الكود</button></form>
    </div>
    <div class="card">
      <h2>طالبات الحلقة</h2>
      ${mine.length ? `<table><thead><tr><th>الاسم</th><th>المستوى</th><th>المتن</th><th>الكود</th><th></th></tr></thead><tbody>${mine.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(level(s.levelId)?.name)}</td><td>${esc(s.matn)}</td><td><b>${esc(s.code)}</b></td><td><button class="btn alt" data-history="${s.id}">السجل</button></td></tr>`).join("")}</tbody></table>` : "<p class='muted'>لا توجد طالبات بعد.</p>"}
    </div>`;
  }

  function recitation(){
    const mine = data.students.filter(s => s.circle === teacher().circle);
    return `<div class="card">
      <h2>التسميع</h2>
      <form id="recForm"><div class="grid">
        <div><label>الطالبة</label><select id="rStudent" required><option value="">اختاري الطالبة</option>${mine.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
        <div><label>المستوى</label><select id="rLevel" required><option value="">اختاري المستوى</option>${LEVELS.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div>
        <div><label>المتن</label><select id="rMatn" required disabled><option value="">اختاري المستوى أولًا</option></select></div>
        <div><label>من</label><input id="rFrom" required placeholder="مثال: 1"></div>
        <div><label>إلى</label><input id="rTo" required placeholder="مثال: 10"></div>
        <div><label>نوع التسميع</label><select id="rType"><option>جديد</option><option>مراجعة</option><option>اختبار</option></select></div>
        <div><label>التقييم</label><select id="rRating"><option>ممتاز</option><option>جيد جدًا</option><option>جيد</option><option>يحتاج متابعة</option></select></div>
        <div><label>التاريخ</label><input id="rDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
      </div>
      <label>ملاحظات</label><textarea id="rNotes" rows="3"></textarea>
      <button class="btn">حفظ التسميع</button></form>
    </div>`;
  }

  function reports(){
    const rec = data.recitations.filter(r => r.circle === teacher().circle).sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="card">
      <h2>التقارير</h2>
      <div class="actions"><button class="btn" id="printReport">طباعة التقرير</button></div>
      <table><thead><tr><th>التاريخ</th><th>الطالبة</th><th>المستوى</th><th>المتن</th><th>من-إلى</th><th>التقييم</th></tr></thead><tbody>${rec.map(r=>`<tr><td>${esc(fmtDate(r.date))}</td><td>${esc(r.studentName)}</td><td>${esc(r.levelName)}</td><td>${esc(r.matn)}</td><td>${esc(r.from)} - ${esc(r.to)}</td><td>${esc(r.rating)}</td></tr>`).join("")||`<tr><td colspan="6">لا توجد سجلات.</td></tr>`}</tbody></table>
    </div>`;
  }

  function settings(){
    const c = circle();
    return `<div class="card">
      <h2>إعدادات الحلقة</h2>
      <form id="circleForm"><div class="grid">
        <div><label>اسم الحلقة</label><input id="cName" value="${esc(c.name)}" required></div>
        <div><label>اليوم</label><select id="cDay">${DAYS.map(d=>`<option ${d===c.day?"selected":""}>${d}</option>`).join("")}</select></div>
        <div><label>نوع الحلقة</label><select id="cMode"><option ${c.mode==="حضوري"?"selected":""}>حضوري</option><option ${c.mode==="عن بعد"?"selected":""}>عن بعد</option></select></div>
      </div><button class="btn">حفظ إعدادات الحلقة</button></form>
    </div>
    <div class="card">
      <h2>المستويات والمتون</h2>
      <div class="notice">القائمة الحالية نموذجية وقابلة للتعديل لاحقًا وفق المنهج المعتمد رسميًا.</div>
      ${LEVELS.map(l=>`<h3>${esc(l.name)}</h3><p>${l.matn.map(esc).join(" — ")}</p>`).join("")}
    </div>`;
  }

  function render(){
    if(!session){
      document.getElementById("app").innerHTML = loginView();
      bindLogin();
      return;
    }
    let content = page==="home" ? home() : page==="students" ? students() : page==="recitation" ? recitation() : page==="reports" ? reports() : settings();
    document.getElementById("app").innerHTML = layout(content);
    bind();
  }

  function bindLogin(){
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const id = document.getElementById("teacherId").value, code = document.getElementById("loginCode").value.trim();
      const t = TEACHERS.find(x => x.id === id);
      if(!t || code !== t.code){ alert("رمز الدخول غير صحيح."); return; }
      session = { teacherId: t.id };
      localStorage.setItem(SESSION, JSON.stringify(session));
      page = "home";
      render();
    });
  }

  function fillMatn(levelEl, matnEl){
    const l = level(levelEl.value);
    matnEl.disabled = !l;
    matnEl.innerHTML = l ? `<option value="">اختاري المتن</option>${l.matn.map(m=>`<option>${esc(m)}</option>`).join("")}` : `<option>اختاري المستوى أولًا</option>`;
  }

  function bind(){
    document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { page = b.dataset.page; render(); });
    document.getElementById("logout").onclick = () => { session = null; localStorage.removeItem(SESSION); render(); };

    const sf = document.getElementById("studentForm");
    if(sf){
      const sLevelEl = document.getElementById("sLevel"), sMatnEl = document.getElementById("sMatn");
      sLevelEl.onchange = () => fillMatn(sLevelEl, sMatnEl);
      sf.onsubmit = e => {
        e.preventDefault();
        const name = document.getElementById("sName").value.trim(), lid = sLevelEl.value, matn = sMatnEl.value;
        if(!name || !lid || !matn){ alert("أكملي البيانات."); return; }
        const id = Date.now().toString(36), code = "ST-" + Math.random().toString(36).slice(2,7).toUpperCase();
        data.students.push({ id, code, name, levelId: lid, matn, circle: teacher().circle, createdAt: new Date().toISOString() });
        save();
        alert("تم حفظ الطالبة. كودها: " + code);
        render();
      };
      document.querySelectorAll("[data-history]").forEach(b => b.onclick = () => showHistory(b.dataset.history));
    }

    const rf = document.getElementById("recForm");
    if(rf){
      const rLevelEl = document.getElementById("rLevel"), rMatnEl = document.getElementById("rMatn");
      rLevelEl.onchange = () => fillMatn(rLevelEl, rMatnEl);
      rf.onsubmit = e => {
        e.preventDefault();
        const st = data.students.find(s => s.id === document.getElementById("rStudent").value), lv = level(rLevelEl.value);
        if(!st || !lv || !rMatnEl.value){ alert("أكملي بيانات التسميع."); return; }
        const now = new Date();
        data.recitations.push({
          id: Date.now().toString(36), studentId: st.id, studentName: st.name, circle: teacher().circle,
          levelId: lv.id, levelName: lv.name, matn: rMatnEl.value,
          from: document.getElementById("rFrom").value.trim(), to: document.getElementById("rTo").value.trim(),
          type: document.getElementById("rType").value, rating: document.getElementById("rRating").value,
          notes: document.getElementById("rNotes").value.trim(), date: document.getElementById("rDate").value,
          time: now.toTimeString().slice(0,5), teacherId: teacher().id, teacherName: teacher().name
        });
        st.levelId = lv.id; st.matn = rMatnEl.value;
        save();
        alert("تم حفظ التسميع بنجاح.");
        render();
      };
    }

    const cf = document.getElementById("circleForm");
    if(cf) cf.onsubmit = e => {
      e.preventDefault();
      const c = circle();
      c.name = document.getElementById("cName").value.trim();
      c.day = document.getElementById("cDay").value;
      c.mode = document.getElementById("cMode").value;
      save();
      alert("تم حفظ إعدادات الحلقة.");
      render();
    };

    const pr = document.getElementById("printReport");
    if(pr) pr.onclick = () => window.print();
  }

  function showHistory(id){
    const s = data.students.find(x => x.id === id), rs = data.recitations.filter(r => r.studentId === id);
    alert("الطالبة: " + s.name + "\n\n" + (rs.length ? rs.map(r => `${r.date} | ${r.matn} | ${r.from}-${r.to} | ${r.rating}`).join("\n") : "لا يوجد سجل تسميع."));
  }

  render();
})();
</script>
</body>
  </html>
